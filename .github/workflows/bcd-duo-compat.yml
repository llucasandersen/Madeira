name: BCD 623 Duo display compatibility layer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Duo SDK
        run: bash build/ci/select-duo-sdk.sh
      - name: Build and exercise UIKit compatibility layer
        run: bash tools/bcd-duo/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BCD-Duo-display
          path: |
            build/bcd-duo-compat/BCDDuo.dylib
            build/bcd-duo-compat/*.json
            build/bcd-duo-compat/load-commands.txt
